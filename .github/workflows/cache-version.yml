name: Update cache version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: cache-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bump-cache-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update cache version
        shell: pwsh
        run: |
          $version = "${env:GITHUB_SHA}".Substring(0, 12)
          ./scripts/bump-cache-version.ps1 -Version $version

      - name: Commit cache version
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Cache version is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/*.js
          git commit -m "chore: update cache version"
          git push
